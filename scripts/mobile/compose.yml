services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: milk_mobile
      POSTGRES_PASSWORD: milk_mobile_local
      POSTGRES_DB: milk_mobile
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - ../../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milk_mobile"]
      interval: 2s
      timeout: 2s
      retries: 30
